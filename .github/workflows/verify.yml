name: Verify application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Check formatting, test and package
        working-directory: backend
        run: sh ./mvnw --batch-mode --no-transfer-progress verify

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Start Spring Boot and MySQL
        run: docker compose --env-file .env.example up --build --detach
      - name: Check application and four role accounts
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/login > /tmp/login.html; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:8080/login > /tmp/login.html
          grep -q 'name="username"' /tmp/login.html
          curl --silent --dump-header /tmp/proxy-headers --output /dev/null \
            --header 'Host: restaurant.example' \
            --header 'X-Forwarded-Proto: https' http://localhost:8080/
          grep -Eqi '^location: https://restaurant\.example/login' /tmp/proxy-headers
          for role in manager waiter chef cashier; do
            case "$role" in
              manager) path=employees ;;
              waiter) path=orders ;;
              chef) path=kitchen ;;
              cashier) path=payments ;;
            esac
            for username in "$role"; do
              cookies=$(mktemp)
              curl --fail --silent --cookie-jar "$cookies" http://localhost:8080/login > /tmp/login.html
              token=$(sed -n 's/.*name="_csrf"[^>]*value="\([^" ]*\)".*/\1/p' /tmp/login.html)
              test -n "$token"
              code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                --cookie "$cookies" --cookie-jar "$cookies" \
                --data-urlencode "_csrf=$token" \
                --data-urlencode "username=$username" \
                --data-urlencode "password=123456" http://localhost:8080/login)
              test "$code" = 302
              curl --fail --silent --cookie "$cookies" http://localhost:8080/home > /tmp/home.html
              grep -q 'Welcome, ' /tmp/home.html
              ! grep -qi 'demo' /tmp/home.html
              code=$(curl --silent --output /tmp/page.html --write-out '%{http_code}' \
                --cookie "$cookies" "http://localhost:8080/$path")
              test "$code" = 200
            done
          done
          for username in 'mánager' ' manager' 'manager '; do
            cookies=$(mktemp)
            curl --fail --silent --cookie-jar "$cookies" http://localhost:8080/login > /tmp/login.html
            token=$(sed -n 's/.*name="_csrf"[^>]*value="\([^" ]*\)".*/\1/p' /tmp/login.html)
            target=$(curl --silent --location --output /dev/null --write-out '%{url_effective}' \
              --cookie "$cookies" --cookie-jar "$cookies" \
              --data-urlencode "_csrf=$token" \
              --data-urlencode "username=$username" \
              --data-urlencode 'password=123456' http://localhost:8080/login)
            test "$target" = 'http://localhost:8080/login?error'
          done
          tables=$(docker compose --env-file .env.example exec -T db sh -c \
            'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u"$MYSQL_USER" "$MYSQL_DATABASE" -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE()"')
          test "$tables" = 9
      - name: Check persistent MySQL data
        shell: bash
        run: |
          docker compose --env-file .env.example exec -T db sh -c \
            'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u"$MYSQL_USER" "$MYSQL_DATABASE" -e "UPDATE Menu_item SET unit_price=77.00 WHERE item_id=9111"'
          docker compose --env-file .env.example down
          docker compose --env-file .env.example up --detach
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/login > /tmp/login.html; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:8080/login > /tmp/login.html
          price=$(docker compose --env-file .env.example exec -T db sh -c \
            'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u"$MYSQL_USER" "$MYSQL_DATABASE" -N -e "SELECT unit_price FROM Menu_item WHERE item_id=9111"')
          test "$price" = 77.00
      - name: Container logs
        if: always()
        run: docker compose --env-file .env.example logs --no-color --tail 150
      - name: Stop test containers
        if: always()
        run: docker compose --env-file .env.example down
