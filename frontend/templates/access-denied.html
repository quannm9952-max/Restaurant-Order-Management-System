<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{shared/shell :: head('Access denied')}"></head>
  <body>
    <aside th:replace="~{shared/shell :: sidebar('')}"></aside>
    <header
      th:replace="~{shared/shell :: header('Restaurant workspace')}"
    ></header>
    <main
      class="main-content"
      th:classappend="${#maps.isEmpty(user)} ? 'anonymous-error'"
    >
      <section class="panel panel-pad modal-page">
        <h1>Access denied</h1>
        <p
          class="mt-3"
          th:text="${errorMessage ?: 'Your role does not have permission to open this page.'}"
        ></p>
        <div class="flex-row mt-4">
          <a class="btn btn-primary" href="/home">Back to home</a
          ><a class="btn btn-outline-secondary" href="/login">Sign in</a>
        </div>
      </section>
    </main>
  </body>
</html>
