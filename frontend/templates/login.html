<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login &#183; Restaurant</title>
    <link rel="stylesheet" href="/css/fonts.css" />
    <link rel="stylesheet" href="/css/login.css" />
    <script defer src="/js/app.js"></script>
  </head>
  <body>
    <aside class="login-brand">
      <img
        src="/images/login/brand-panel.png"
        alt="Restaurant Order Management System. Welcome to your daily service workspace. One team. Seamless service."
      />
    </aside>
    <main class="login-main">
      <form class="login-form" th:action="@{/login}" method="post" novalidate>
        <h1>Welcome Back</h1>
        <p>Sign in to access your role-based workspace.</p>
        <div
          class="login-alert"
          role="alert"
          th:if="${loginError != null}"
          th:text="${loginError}"
        >
          Incorrect username or password.
        </div>
        <div class="login-success" role="status" th:if="${param.logout}">
          You have been logged out.
        </div>
        <label for="username">Username</label
        ><input
          id="username"
          name="username"
          data-username
          placeholder="Enter your username"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          pattern="[A-Za-z0-9_]{1,50}"
          title="Use 1-50 characters: A-Z, a-z, 0-9 and underscore (_)."
          aria-describedby="usernameHelp"
          required
          autofocus
        />
        <small class="username-hint" id="usernameHelp" role="status">
          A-Z, a-z, 0-9 and underscore (_) only.
        </small>
        <label for="password">Password</label>
        <div class="password-field">
          <input
            id="password"
            type="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          /><button
            type="button"
            data-password-toggle="password"
            aria-label="Show or hide password"
            aria-pressed="false"
          >
            Show
          </button>
        </div>
        <button class="login-button" type="submit">
          Login <span>&#8594;</span>
        </button>
        <div class="login-note">
          <img src="/images/icons/lock-small.svg" alt="" />For authorized
          restaurant employees only.
        </div>
      </form>
    </main>
  </body>
</html>
