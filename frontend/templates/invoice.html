<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{shared/shell :: head(${paid ? 'Invoice' : 'Bill Preview'})}"
  ></head>
  <body>
    <div class="invoice-actions no-print">
      <a class="btn btn-outline-secondary" href="/payments"
        >&#8592; Back to Payment &amp; Invoice</a
      ><button class="btn btn-primary" onclick="window.print()">
        <span th:text="${paid ? 'Print Invoice' : 'Print Bill'}"
          >Print Bill</span
        >
      </button>
    </div>
    <main class="invoice-paper">
      <div class="flex-row spread">
        <div>
          <h1>Oak &amp; Ember Restaurant</h1>
          <p th:if="${paid}">Dine-in invoice</p>
        </div>
        <span
          class="status-chip"
          th:classappend="${paid ? 'completed' : 'open'}"
          th:text="${paid ? 'Paid' : 'Unpaid'}"
        ></span>
      </div>
      <dl class="invoice-meta">
        <div>
          <dt th:text="${paid ? 'Invoice number' : 'Bill reference'}"></dt>
          <dd th:text="${invoiceNumber}"></dd>
        </div>
        <div>
          <dt>Order</dt>
          <dd th:text="'ORD-' + ${order.id}"></dd>
        </div>
        <div>
          <dt>Table</dt>
          <dd th:text="${order.table_code}"></dd>
        </div>
        <div>
          <dt th:text="${paid ? 'Paid at' : 'Order created at'}"></dt>
          <dd th:text="${paid ? payment.paid_at : order.created_at}"></dd>
        </div>
        <div th:if="${paid}">
          <dt>Payment method</dt>
          <dd th:text="${payment.methodLabel}"></dd>
        </div>
        <div>
          <dt>Served by</dt>
          <dd th:text="${order.waiter_name}"></dd>
        </div>
      </dl>
      <div class="table-responsive">
        <table class="bill-items">
          <thead>
            <tr>
              <th>ITEM</th>
              <th>QTY</th>
              <th class="right">UNIT PRICE</th>
              <th class="right">SUBTOTAL</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="line : ${items}">
              <td th:text="${line.item_name}"></td>
              <td th:text="${line.quantity}"></td>
              <td
                class="right"
                th:text="${@money.format(line.unit_price)}"
              ></td>
              <td
                class="right strong"
                th:text="${@money.format(line.line_total)}"
              ></td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="bill-total mt-4">
        <span th:text="${paid ? 'Total paid' : 'Amount due'}"></span
        ><strong th:text="${@money.format(total)}"></strong>
      </div>
      <footer class="invoice-thanks">
        <h2>Thank you for dining with us!</h2>
        <p class="tiny" th:if="${!paid}">
          Please check the items, quantities and amount with the cashier before
          payment.
        </p>
      </footer>
    </main>
  </body>
</html>
