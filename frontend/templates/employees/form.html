<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Employee Account - Restaurant Order Management System</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f6f7f9; margin: 0; padding: 40px; color: #14202e; }
    .card { background: white; padding: 28px; border-radius: 12px; border: 1px solid #e4e8ee; max-width: 560px; margin: 0 auto; }
    h2 { margin: 0 0 4px; }
    .badge { background: #fdeee3; color: #c4501a; font-size: 12px; padding: 3px 10px; border-radius: 12px; margin-left: 8px; }
    label { display: block; font-size: 14px; font-weight: bold; margin: 18px 0 6px; }
    input[type=text], input[type=password], select {
      width: 100%; padding: 12px 14px; border: 1px solid #dde2e8; border-radius: 8px; font-size: 15px; box-sizing: border-box;
    }
    input:focus, select:focus { outline: 2px solid #e8641f33; border-color: #e8641f; }
    .hint { color: #6b7685; font-size: 12px; margin-top: 4px; }
    .row { display: flex; gap: 12px; align-items: center; margin-top: 20px; }
    .row input[type=checkbox] { width: 18px; height: 18px; }
    .actions { margin-top: 26px; display: flex; gap: 12px; align-items: center; }
    button { padding: 12px 22px; background: #e8641f; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
    button:hover { background: #d1561a; }
    a { color: #e8641f; text-decoration: none; }
    .error { background: #fdecea; color: #b3261e; padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-top: 18px; }
  </style>
<link rel="stylesheet" href="/css/workspace.css"></head>
<body><div th:replace="~{shared/navigation :: navigation}"></div>
  <div class="card">
    <h2>
      <span th:text="${editing} ? 'Edit Employee Account' : 'New Employee Account'">New Employee Account</span>
      <span class="badge">Manager only</span>
    </h2>
    <p>Assigned roles are Waiter, Chef, Cashier or Manager (UC03).</p>

    <div class="error" th:if="${error}" th:text="${error}">Error message</div>

    <form th:action="@{/employees/save}" method="post">
      <input type="hidden" name="id" th:value="${form['id']}">

      <label for="fullName">Full name</label>
      <input type="text" id="fullName" name="fullName" th:value="${form['fullName']}" placeholder="e.g. Nguyen Van A" required>

      <label for="position">Position</label>
      <input type="text" id="position" name="position" th:value="${form['position']}" placeholder="e.g. Waiter">
      <div class="hint">Leave blank to use the role name.</div>

      <label for="username">Username</label>
      <input type="text" id="username" name="username" th:value="${form['username']}" placeholder="e.g. waiter_02" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password">
      <div class="hint" th:text="${editing} ? 'Leave blank to keep the current password.' : 'Required for a new account.'"></div>

      <label for="role">Role</label>
      <select id="role" name="role">
        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                th:selected="${form['role'] != null and form['role'] == r.name()}"></option>
      </select>

      <div class="row">
        <input type="checkbox" id="active" name="active" value="true" th:checked="${form['active'] == true}">
        <label for="active" style="margin:0;">Account is active (uncheck to deactivate / lock sign-in)</label>
      </div>

      <div class="actions">
        <button type="submit">Save account</button>
        <a th:href="@{/employees}">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
