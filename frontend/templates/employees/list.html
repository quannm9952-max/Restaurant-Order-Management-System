<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Employee Management</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f6f7f9; margin: 0; padding: 40px; color: #14202e; }
    .card { background: white; padding: 24px; border-radius: 12px; border: 1px solid #e4e8ee; }
    h2 { margin: 0 0 4px; }
    .badge { background: #fdeee3; color: #c4501a; font-size: 12px; padding: 3px 10px; border-radius: 12px; margin-left: 8px; }
    .head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 8px; }
    a { color: #e8641f; text-decoration: none; }
    .btn { display: inline-block; padding: 10px 18px; background: #e8641f; color: white; border-radius: 8px; }
    .btn:hover { background: #d1561a; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eef0f3; font-size: 14px; }
    th { background: #f6f7f9; color: #6b7685; font-weight: normal; }
    .pill { padding: 3px 10px; border-radius: 12px; font-size: 12px; }
    .active { background: #e8f5ee; color: #1e7a46; }
    .locked { background: #fdecea; color: #b3261e; }
    .saved { background: #e8f5ee; color: #1e7a46; padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-top: 14px; }
  </style>
<link rel="stylesheet" href="/css/workspace.css"></head>
<body><div th:replace="~{shared/navigation :: navigation}"></div>
  <div class="card">
    <div class="head">
      <h2>Employee Management <span class="badge">Manager only</span></h2>
      <a class="btn" th:href="@{/employees/new}">+ New account</a>
    </div>
    <p>Manage employee accounts, roles, and sign-in access.
       <a th:href="@{/home}">Back to home</a></p>

    <div class="saved" th:if="${param.saved}">Changes saved successfully.</div>

    <table>
      <tr>
        <th>Employee ID</th><th>Full Name</th><th>Username</th><th>Role</th><th>Account Status</th><th>Actions</th>
      </tr>
      <tr th:each="a : ${accounts}">
        <td th:text="${#strings.concat('EMP-', #numbers.formatInteger(a.employee.employeeId, 3))}">EMP-001</td>
        <td th:text="${a.employee.fullName}">Name</td>
        <td th:text="${a.username}">user</td>
        <td th:text="${a.role}">ROLE</td>
        <td>
          <span th:if="${a.active}" class="pill active">Active</span>
          <span th:unless="${a.active}" class="pill locked">Locked</span>
        </td>
        <td><a th:href="@{/employees/{id}/edit(id=${a.accountId})}">Edit</a></td>
      </tr>
    </table>
  </div>
</body>
</html>
