<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:fragment="head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title} + ' · Restaurant'">Restaurant</title>
    <link rel="stylesheet" th:href="@{/css/vendor/bootstrap-5.3.8.min.css}" />
    <link rel="stylesheet" th:href="@{/css/fonts.css}" />
    <link rel="stylesheet" th:href="@{/css/reports.css}" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <script defer src="/js/app.js"></script>
    <script defer th:src="@{/js/reports.js}"></script>
  </head>
  <body>
    <aside
      th:fragment="sidebar(section)"
      th:replace="~{shared/shell :: sidebar(${section})}"
    ></aside>
    <header
      th:fragment="header(title)"
      th:replace="~{shared/shell :: header(${title})}"
    ></header>
    <section th:fragment="heading(title,description)" class="page-heading">
      <div>
        <div class="title-line">
          <h1 th:text="${title}">Reports &amp; Payment History</h1>
          <span class="manager-badge">Manager access</span
          ><span th:if="${demoMode}" class="demo-badge">DEMO</span>
        </div>
        <p th:text="${description}">
          Review restaurant revenue and retained payment records.
        </p>
      </div>
      <span class="read-only"
        ><img th:src="@{/images/icons/lock-small.svg}" alt="" />Read-only</span
      >
    </section>
    <nav
      th:fragment="tabs(section,range)"
      class="main-tabs"
      aria-label="Reports and history"
    >
      <a
        th:classappend="${section == 'revenue'} ? 'selected'"
        th:href="@{/manager/reports(from=${range.from},to=${range.to})}"
        ><img th:src="@{/images/icons/chart-active.svg}" alt="" />Revenue
        Reports</a
      >
      <a
        th:classappend="${section == 'history'} ? 'selected'"
        th:href="@{/manager/payment-history(from=${range.from},to=${range.to})}"
        ><img th:src="@{/images/icons/clock.svg}" alt="" />Payment History</a
      >
    </nav>
    <div th:fragment="dateRange(range)" class="date-control">
      <button class="date-trigger" type="button" data-open-dates>
        <img th:src="@{/images/icons/calendar.svg}" alt="" /><span
          th:text="${range.display()}"
          >Selected date range</span
        ><img th:src="@{/images/icons/chevron.svg}" alt="" />
      </button>
      <span class="subtle">Selected date range</span>
      <div class="date-popover panel" data-date-popover hidden>
        <div class="popover-heading">
          <div>
            <h2>Select date range</h2>
            <p>Choose the payment dates included in the report.</p>
          </div>
          <button
            type="button"
            class="icon-button"
            data-close-dates
            aria-label="Close date selector"
          >
            <img th:src="@{/images/icons/close.svg}" alt="" />
          </button>
        </div>
        <div class="calendar-pair" data-calendars></div>
        <div class="date-inputs">
          <label
            >Start date<input
              class="form-control"
              name="from"
              type="date"
              required
              th:value="${range.from}" /></label
          ><label
            >End date<input
              class="form-control"
              name="to"
              type="date"
              required
              th:value="${range.to}"
          /></label>
        </div>
        <p class="date-error" role="alert" data-date-error hidden>
          End date must be on or after the start date.
        </p>
        <div class="popover-actions">
          <button
            type="button"
            class="btn btn-outline-secondary"
            data-close-dates
          >
            Cancel</button
          ><button type="submit" class="btn btn-primary">Apply range</button>
        </div>
      </div>
    </div>
    <span
      th:fragment="status(value,label)"
      class="status-pill"
      th:classappend="${#strings.toLowerCase(value)}"
      ><i></i><span th:text="${label}">Status</span></span
    >
  </body>
</html>
