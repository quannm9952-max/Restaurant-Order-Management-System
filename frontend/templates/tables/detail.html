<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chi tiết bàn - Quản lý nhà hàng</title>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav><a class="btn btn-outline-primary mb-3" th:if="${user.role=='Manager'}" th:href="@{/tables/{id}/edit(id=${table.id})}">Edit table</a>
<div th:replace="~{fragments/layout :: flashMessages}"></div>

<div class="container-fluid mt-3">
    <a href="/tables" class="btn btn-outline-secondary btn-sm mb-3">&larr; Quay lại danh sách</a>

    <h2 th:text="'Bàn ' + ${table.tableName}"></h2>

    <!-- Table info -->
    <div class="card mb-4">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Tên bàn</dt>
                <dd class="col-sm-9" th:text="${table.tableName}"></dd>

                <dt class="col-sm-3">Sức chứa</dt>
                <dd class="col-sm-9" th:text="${table.capacity} + ' người'"></dd>

                <dt class="col-sm-3">Trạng thái</dt>
                <dd class="col-sm-9">
                    <span th:class="'status-' + ${#strings.toLowerCase(table.status.name())}"
                          th:text="${#strings.capitalize(#strings.toLowerCase(table.status.name()))}">
                    </span>
                </dd>
            </dl>
        </div>
    </div>

    <!-- Open order info -->
    <div class="card mb-4" th:if="${openOrder != null}">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>Đơn hàng đang mở</span>
            <a th:href="@{/orders/{id}(id=${openOrder.id})}" class="btn btn-sm btn-outline-primary">
                Xem chi tiết đơn #<span th:text="${openOrder.id}"></span>
            </a>
        </div>
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Mã đơn</dt>
                <dd class="col-sm-9" th:text="${openOrder.id}"></dd>

                <dt class="col-sm-3">Ngày tạo</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(openOrder.createdAt, 'dd/MM/yyyy HH:mm')}"></dd>

                <dt class="col-sm-3">Tổng tiền</dt>
                <dd class="col-sm-9" th:text="${#numbers.formatDecimal(openOrder.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></dd>

                <dt class="col-sm-3">Số dòng món</dt>
                <dd class="col-sm-9" th:text="${openOrder.itemCount}"></dd>
            </dl>
        </div>
    </div>

    <!-- Create order button (only if canCreateOrder) -->
    <div class="mb-4" th:if="${table.canCreateOrder}">
        <a th:href="@{/orders/new(tableId=${table.id})}" class="btn btn-success" th:if="${user.role=='Waiter'}">
            Tạo đơn mới cho bàn này
        </a>
    </div>

    <!-- Update status form (only if canChangeStatus) -->
    <div class="card" th:if="${table.canChangeStatus}">
        <div class="card-header">Cập nhật trạng thái bàn</div>
        <div class="card-body">
            <form th:action="@{/tables/{id}/status(id=${table.id})}" method="post">
                <div class="row g-2 align-items-end">
                    <div class="col-auto">
                        <label for="newStatus" class="form-label">Trạng thái mới</label>
                        <select id="newStatus" name="newStatus" class="form-select">
                            <option value="AVAILABLE" th:selected="${table.status.name() == 'AVAILABLE'}">AVAILABLE (Sẵn sàng)</option>
                            <option value="OUT_OF_SERVICE" th:selected="${table.status.name() == 'OUT_OF_SERVICE'}">OUT_OF_SERVICE (Ngoài dịch vụ)</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-warning">Cập nhật</button>
                    </div>
                </div>
            </form>
            <small class="text-muted d-block mt-2">
                Chỉ có thể chuyển giữa AVAILABLE và OUT_OF_SERVICE. Bàn có đơn OPEN không thể thay đổi trạng thái.
            </small>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
