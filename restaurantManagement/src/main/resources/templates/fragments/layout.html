<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} != null ? ${pageTitle} + ' - Quản lý nhà hàng' : 'Quản lý nhà hàng'">Quản lý nhà hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/tables">🍽️ Nhà hàng</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/tables">Bàn</a>
            <a class="nav-link" href="/orders">Đơn hàng</a>
        </div>
    </div>
</nav>

<div th:fragment="flashMessages" class="container-fluid mt-3">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<div th:fragment="content" class="container-fluid mt-3">
    <!-- Page content goes here -->
</div>

<footer th:fragment="footer" class="mt-5 py-3 bg-light border-top">
    <div class="container text-center text-muted">
        <small>Restaurant Order Management System &copy; 2025</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
