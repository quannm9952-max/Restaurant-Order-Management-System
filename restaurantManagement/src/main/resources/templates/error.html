<!-- Figma frame: Table Management · Roles and modals -->
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error - Restaurant Order Management</title>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body class="app-body">

<aside th:replace="~{fragments/layout :: sidebar}"></aside>

<div class="app-wrapper">
    <header th:replace="~{fragments/layout :: topbar}"></header>

    <main class="app-content">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="alert alert-danger" role="alert" style="border-radius:12px;">
                    <h4 class="alert-heading"><i class="bi bi-exclamation-triangle-fill me-2"></i>Something went wrong</h4>
                    <p th:text="${errorMessage}">An error occurred.</p>
                    <hr>
                    <a class="btn btn-primary btn-orange me-2" href="/tables">Back to Tables</a>
                    <a class="btn btn-outline-secondary" href="/orders">Orders</a>
                </div>
            </div>
        </div>
    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
