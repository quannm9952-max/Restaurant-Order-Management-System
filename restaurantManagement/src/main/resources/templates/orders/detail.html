<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order #<span th:text="${order != null} ? ${order.id} : ''"></span> - Restaurant Order Management</title>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body class="app-body">

<aside th:replace="~{fragments/layout :: sidebar}"></aside>

<div class="app-wrapper">
    <header th:replace="~{fragments/layout :: topbar}"></header>

    <main class="app-content">
        <div th:replace="~{fragments/layout :: flashMessages}"></div>

        <div class="mb-3">
            <a href="/orders" class="back-link">
                <i class="bi bi-arrow-left me-1"></i>Back to Orders
            </a>
        </div>

        <div class="page-header">
            <div>
                <h2 class="page-heading">Order #<span th:text="${order.id}"></span></h2>
                <p class="page-subheading">View order details and manage items.</p>
            </div>
            <span th:class="'status-' + ${#strings.toLowerCase(order.status.name())}"
                  th:text="${#strings.capitalize(#strings.toLowerCase(order.status.name()))}">
            </span>
        </div>

        <!-- Order info card -->
        <div class="card mb-4" style="border-radius:12px; border:1px solid var(--color-gray-border); max-width:800px;">
            <div class="card-body p-4">
                <div class="row mb-2">
                    <div class="col-sm-3 text-muted">Table</div>
                    <div class="col-sm-9">
                        <a th:href="@{/tables/{id}(id=${order.tableId})}" class="text-decoration-none"
                           th:text="${order.tableName}"></a>
                    </div>
                </div>
                <div class="row mb-2">
                    <div class="col-sm-3 text-muted">Created</div>
                    <div class="col-sm-9" th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></div>
                </div>
                <div class="row mb-2">
                    <div class="col-sm-3 text-muted">Waiter</div>
                    <div class="col-sm-9" th:text="${order.employeeName}"></div>
                </div>
                <div class="row mb-2">
                    <div class="col-sm-3 text-muted">Total</div>
                    <div class="col-sm-9 fw-bold"
                         th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></div>
                </div>
                <div class="row">
                    <div class="col-sm-3 text-muted">Note</div>
                    <div class="col-sm-9" th:text="${order.note != null and !order.note.isEmpty()} ? ${order.note} : '(None)'"></div>
                </div>
            </div>
        </div>

        <!-- Order details table -->
        <h5 class="mb-3">Order Items</h5>
        <div class="card mb-4" style="border-radius:12px; border:1px solid var(--color-gray-border);">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr style="background-color:var(--color-gray-lighter);">
                        <th style="padding:12px 16px;">#</th>
                        <th style="padding:12px 16px;">Item</th>
                        <th style="padding:12px 16px;">Unit Price</th>
                        <th style="padding:12px 16px;">Qty</th>
                        <th style="padding:12px 16px;">Subtotal</th>
                        <th style="padding:12px 16px;">Status</th>
                        <th style="padding:12px 16px;">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="line, iterStat : ${order.lines}">
                        <td th:text="${iterStat.count}"></td>
                        <td th:text="${line.itemNameAtOrder}"></td>
                        <td th:text="${#numbers.formatDecimal(line.unitPriceAtOrder, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
                        <td th:text="${line.quantity}"></td>
                        <td th:text="${#numbers.formatDecimal(line.subtotal, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
                        <td>
                            <span th:class="'status-' + ${#strings.toLowerCase(line.cookingStatus.name())}"
                                  th:text="${#strings.capitalize(#strings.toLowerCase(line.cookingStatus.name()))}">
                            </span>
                        </td>
                        <td>
                            <th:block th:if="${line.canEdit}">
                                <th:block th:if="${line.quantity >= 2}">
                                    <form th:action="@{/orders/{id}/items/{detailId}/quantity(id=${order.id}, detailId=${line.detailId})}"
                                          method="post" class="d-inline-flex gap-1 align-items-center me-2">
                                        <input type="number" name="newQuantity" class="form-control form-control-sm"
                                               style="width: 80px;"
                                               min="1"
                                               th:max="${line.quantity - 1}"
                                               th:value="${line.quantity - 1}"
                                               placeholder="Qty">
                                        <button type="submit" class="btn btn-sm btn-outline-warning">Reduce</button>
                                    </form>
                                </th:block>
                                <form th:action="@{/orders/{id}/items/{detailId}/cancel(id=${order.id}, detailId=${line.detailId})}"
                                      method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Cancel this item line?')">
                                        Cancel
                                    </button>
                                </form>
                            </th:block>
                            <th:block th:unless="${line.canEdit}">
                                <span class="text-muted">—</span>
                            </th:block>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(order.lines)}">
                        <td colspan="7" class="text-center text-muted py-4">No items.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Add items form (only for OPEN orders) -->
        <div class="card mb-4" th:if="${order.canEdit}" style="border-radius:12px; border:1px solid var(--color-gray-border);">
            <div class="card-body p-4">
                <h5 class="mb-3">Add Items to Order</h5>
                <form th:action="@{/orders/{id}/items(id=${order.id})}" method="post">
                    <div id="orderLinesContainer">
                        <div class="order-line-row row g-2 align-items-end mb-2">
                            <div class="col-md-6">
                                <label for="addItemId" class="form-label">Item</label>
                                <select id="addItemId" class="form-select" name="lines[0].itemId">
                                    <option value="">-- Select item --</option>
                                    <option th:each="item : ${availableItems}"
                                            th:value="${item.id}"
                                            th:text="${item.itemName} + ' - ' + ${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="addQuantity" class="form-label">Quantity</label>
                                <input id="addQuantity" type="number" class="form-control"
                                       name="lines[0].quantity" min="1" value="1" placeholder="Qty">
                            </div>
                            <div class="col-md-3">
                                <button type="button" class="btn btn-outline-danger btn-sm" onclick="removeOrderLine(this)">
                                    Remove
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-outline-success btn-sm" onclick="addOrderLine()">
                            <i class="bi bi-plus-circle me-1"></i>Add Line
                        </button>
                        <button type="submit" class="btn btn-primary btn-orange">Add to Order</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Cancel entire order form (only when allowed) -->
        <div class="card mb-4" th:if="${order.canCancelOrder}" style="border-radius:12px; border:1px solid var(--color-gray-border);">
            <div class="card-body p-4">
                <h5 class="text-danger mb-3"><i class="bi bi-x-circle me-2"></i>Cancel Order</h5>
                <form th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post">
                    <div class="mb-3">
                        <label for="cancelReason" class="form-label">Reason (optional)</label>
                        <textarea id="cancelReason" class="form-control" name="reason" rows="2"
                                  placeholder="Reason for cancelling..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-danger"
                            onclick="return confirm('Cancel this entire order? Table will return to Available.')">
                        Cancel Order
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
