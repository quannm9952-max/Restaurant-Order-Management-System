<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tạo đơn mới - Quản lý nhà hàng</title>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flashMessages}"></div>

<div class="container-fluid mt-3">
    <a href="/tables" class="btn btn-outline-secondary btn-sm mb-3">&larr; Quay lại danh sách bàn</a>

    <h2>Tạo đơn mới</h2>

    <div class="alert alert-info" role="alert">
        <strong>Bàn:</strong> <span th:text="${param.tableId}"></span>
    </div>

    <!-- Validation errors -->
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <form th:action="@{/orders}" method="post" th:object="${form}">
        <!-- Hidden tableId -->
        <input type="hidden" th:field="*{tableId}">

        <!-- Note -->
        <div class="mb-3">
            <label for="note" class="form-label">Ghi chú (tùy chọn)</label>
            <textarea id="note" class="form-control" th:field="*{note}" rows="2"
                      placeholder="Ghi chú cho đơn hàng..."></textarea>
        </div>

        <!-- Order lines -->
        <h5>Danh sách món</h5>
        <div id="orderLinesContainer">
            <div th:each="line, iterStat : *{lines}" class="order-line-row row g-2 align-items-end mb-2">
                <div class="col-md-6">
                    <label th:for="'itemId-' + ${iterStat.index}" class="form-label">Món</label>
                    <select th:id="'itemId-' + ${iterStat.index}"
                            class="form-select"
                            th:field="*{lines[__${iterStat.index}__].itemId}">
                        <option value="">-- Chọn món --</option>
                        <option th:each="item : ${availableItems}"
                                th:value="${item.id}"
                                th:text="${item.itemName} + ' - ' + ${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label th:for="'quantity-' + ${iterStat.index}" class="form-label">Số lượng</label>
                    <input th:id="'quantity-' + ${iterStat.index}"
                           type="number"
                           class="form-control"
                           th:field="*{lines[__${iterStat.index}__].quantity}"
                           min="1"
                           value="1"
                           placeholder="Số lượng">
                </div>
                <div class="col-md-3">
                    <button type="button" class="btn btn-outline-danger btn-sm" onclick="removeOrderLine(this)">
                        Xóa dòng
                    </button>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <button type="button" class="btn btn-outline-success btn-sm" onclick="addOrderLine()">
                + Thêm món
            </button>
        </div>

        <!-- Submit -->
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Tạo đơn</button>
            <a href="/tables" class="btn btn-secondary">Hủy</a>
        </div>
    </form>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
