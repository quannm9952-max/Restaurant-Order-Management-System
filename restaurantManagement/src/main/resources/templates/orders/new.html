<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create New Order - Restaurant Order Management</title>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body class="app-body">

<aside th:replace="~{fragments/layout :: sidebar}"></aside>

<div class="app-wrapper">
    <header th:replace="~{fragments/layout :: topbar}"></header>

    <main class="app-content">
        <div th:replace="~{fragments/layout :: flashMessages}"></div>

        <div class="page-header">
            <div>
                <h2 class="page-heading">Create New Order</h2>
                <p class="page-subheading">Add items to create a new order for the selected table.</p>
            </div>
        </div>

        <div class="mb-3">
            <a href="/tables" class="back-link">
                <i class="bi bi-arrow-left me-1"></i>Back to Table Management
            </a>
        </div>

        <div class="card" style="border-radius:12px; border:1px solid var(--color-gray-border); max-width:700px;">
            <div class="card-body p-4">
                <div class="alert alert-info" role="alert" style="border-radius:8px; border:none;">
                    <i class="bi bi-grid-3x3-gap me-2"></i>
                    <strong>Table ID:</strong> <span th:text="${param.tableId}"></span>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger" role="alert" style="border-radius:8px; border:none;" th:text="${errorMessage}"></div>

                <form th:action="@{/orders}" method="post" th:object="${form}">
                    <input type="hidden" th:field="*{tableId}">

                    <div class="mb-3">
                        <label for="note" class="form-label">Note (optional)</label>
                        <textarea id="note" class="form-control" th:field="*{note}" rows="2"
                                  placeholder="Order note..."></textarea>
                    </div>

                    <h5 class="mb-3">Menu Items</h5>
                    <div id="orderLinesContainer">
                        <div th:each="line, iterStat : *{lines}" class="order-line-row row g-2 align-items-end mb-2">
                            <div class="col-md-6">
                                <label th:for="'itemId-' + ${iterStat.index}" class="form-label">Item</label>
                                <select th:id="'itemId-' + ${iterStat.index}"
                                        class="form-select"
                                        th:field="*{lines[__${iterStat.index}__].itemId}">
                                    <option value="">-- Select item --</option>
                                    <option th:each="item : ${availableItems}"
                                            th:value="${item.id}"
                                            th:text="${item.itemName} + ' - ' + ${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label th:for="'quantity-' + ${iterStat.index}" class="form-label">Quantity</label>
                                <input th:id="'quantity-' + ${iterStat.index}"
                                       type="number"
                                       class="form-control"
                                       th:field="*{lines[__${iterStat.index}__].quantity}"
                                       min="1"
                                       value="1"
                                       placeholder="Qty">
                            </div>
                            <div class="col-md-3">
                                <button type="button" class="btn btn-outline-danger btn-sm" onclick="removeOrderLine(this)">
                                    Remove
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <button type="button" class="btn btn-outline-success btn-sm" onclick="addOrderLine()">
                            <i class="bi bi-plus-circle me-1"></i>Add Item
                        </button>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-orange">Create Order</button>
                        <a href="/tables" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
