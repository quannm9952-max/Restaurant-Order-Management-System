<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Danh sách bàn - Quản lý nhà hàng</title>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flashMessages}"></div>

<div class="container-fluid mt-3">
    <h2>Danh sách bàn</h2>

    <!-- Filter by status -->
    <form method="get" action="/tables" class="row g-2 align-items-end mb-3">
        <div class="col-auto">
            <label for="statusFilter" class="form-label">Lọc theo trạng thái</label>
            <select id="statusFilter" name="status" class="form-select" onchange="this.form.submit()">
                <option value="">Tất cả</option>
                <option th:each="s : ${statuses}"
                        th:value="${s.name()}"
                        th:text="${s.name()}"
                        th:selected="${filterStatus != null and filterStatus == s.name()}">
                </option>
            </select>
        </div>
        <div class="col-auto" th:if="${filterStatus != null}">
            <a class="btn btn-outline-secondary btn-sm" href="/tables">Xóa bộ lọc</a>
        </div>
    </form>

    <!-- Tables table -->
    <table class="table table-striped table-hover">
        <thead class="table-light">
        <tr>
            <th>STT</th>
            <th>Tên bàn</th>
            <th>Sức chứa</th>
            <th>Trạng thái</th>
            <th>Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="table, iter : ${tables}">
            <td th:text="${iter.count}"></td>
            <td>
                <a th:href="@{/tables/{id}(id=${table.id})}" th:text="${table.tableName}"></a>
            </td>
            <td th:text="${table.capacity} + ' người'"></td>
            <td>
                <span th:class="'status-' + ${#strings.toLowerCase(table.status.name())}"
                      th:text="${#strings.capitalize(#strings.toLowerCase(table.status.name()))}">
                </span>
            </td>
            <td>
                <a th:href="@{/tables/{id}(id=${table.id})}" class="btn btn-sm btn-outline-primary">Chi tiết</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(tables)}">
            <td colspan="5" class="text-center text-muted">Không có bàn nào.</td>
        </tr>
        </tbody>
    </table>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
