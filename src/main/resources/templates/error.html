<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Gourmet Palace 5★</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at 50% 20%, #1c261e 0%, #111813 100%);
      color: #f7f5f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      padding: 20px;
    }
    .error-card {
      background: rgba(28, 38, 30, 0.85);
      border: 1px solid rgba(197, 160, 89, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(197, 160, 89, 0.15);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 580px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(12px);
    }
    .restaurant-crest {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 4px;
      color: #c5a059;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: block;
    }
    .error-code {
      font-family: 'Cinzel', serif;
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      margin: 10px 0;
      background: linear-gradient(135deg, #e6ca85 0%, #c5a059 50%, #9a7836 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 20px rgba(197, 160, 89, 0.2);
    }
    .error-title {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 16px;
    }
    .error-desc {
      color: #b8c4b7;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-gold {
      background: linear-gradient(135deg, #c5a059 0%, #9a7836 100%);
      color: #111813;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-gold:hover {
      background: linear-gradient(135deg, #dfc27e 0%, #b89146 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(197, 160, 89, 0.4);
    }
    .btn-outline {
      border: 1px solid rgba(197, 160, 89, 0.5);
      color: #e6ca85;
      padding: 12px 22px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.3s;
    }
    .btn-outline:hover {
      background: rgba(197, 160, 89, 0.15);
      border-color: #c5a059;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <span class="restaurant-crest">GOURMET PALACE &bull; 5-STAR FINE DINING</span>
    <div class="error-code" th:text="${status != null ? status : '404'}">404</div>
    <h1 class="error-title" th:text="${error != null ? error : 'Page Not Found'}">Dining Destination Not Found</h1>
    <p class="error-desc" th:text="${message != null and !#strings.isEmpty(message) ? message : 'The requested dining page or resource could not be found or has moved. Please navigate using the official restaurant menu.'}">
      The requested dining page or resource could not be found or has moved. Please navigate using the official restaurant menu.
    </p>
    <div class="btn-row">
      <a href="/dashboard" class="btn-gold">Go to Dashboard</a>
      <a href="/menu" class="btn-outline">Browse Menu</a>
      <a href="/login" class="btn-outline">Sign In</a>
    </div>
  </div>
</body>
</html>
