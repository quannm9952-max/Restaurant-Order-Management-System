<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login - Restaurant Order Management System</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4;
           display: flex; justify-content: center; align-items: center;
           height: 100vh; margin: 0; }
    .login-box { background: white; padding: 32px; border-radius: 8px;
                 box-shadow: 0 2px 8px rgba(0,0,0,0.15); width: 320px; }
    h2 { text-align: center; margin-top: 0; }
    label { display: block; margin-top: 12px; font-size: 14px; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { width: 100%; margin-top: 20px; padding: 10px; background: #c0392b;
             color: white; border: none; border-radius: 4px;
             font-size: 16px; cursor: pointer; }
    .error { color: #c0392b; font-size: 13px; margin-top: 10px; text-align: center; }
    .success { color: #27ae60; font-size: 13px; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Restaurant Login</h2>
    <form th:action="@{/login}" method="post">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">Login</button>

      <div class="error" th:if="${param.error}">
        Wrong username or password, or the account is disabled.
      </div>
      <div class="success" th:if="${param.logout}">
        You have been logged out.
      </div>
    </form>
  </div>
</body>
</html>
