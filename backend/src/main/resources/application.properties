
spring.application.name=restaurant-order-management

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/restaurant_order_management
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Web Server
server.port=8080
